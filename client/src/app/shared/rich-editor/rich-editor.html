<div class="editor" [class.editor--compact]="compact()">
  <div class="editor__toolbar" role="toolbar" aria-label="Formatting">
    @for (group of groups; track group.name) {
      <div class="editor__group" role="group" [attr.aria-label]="group.name">
        @for (tool of group.tools; track tool.id) {
          <button
            class="tool"
            type="button"
            [class.tool--on]="isActive(tool)"
            [class.tool--wide]="tool.glyph.length > 1"
            [attr.aria-label]="tool.label"
            [attr.aria-pressed]="tool.kind === 'action' ? null : isActive(tool)"
            (click)="run(tool)"
          >
            <span class="tool__glyph">{{ tool.glyph }}</span>
            <!-- Ours rather than `title`: the native tooltip waits about a second
                 before it appears, which is most of why the toolbar reads as guesswork. -->
            <span class="tool__tip">{{ tool.label }}</span>
          </button>
        }
      </div>
    }

    @if (uploading()) {
      <span class="editor__status">Uploading…</span>
    } @else if (uploadError()) {
      <span class="editor__status editor__status--error">{{ uploadError() }}</span>
    }
  </div>

  <!-- Table controls, shown only while the cursor is inside a table. -->
  @if (inTable()) {
    <div class="editor__toolbar editor__toolbar--table" role="toolbar" aria-label="Table">
      <span class="editor__group-label">Table</span>
      @for (tool of tableTools; track tool.id) {
        <button
          class="tool"
          type="button"
          [class.tool--wide]="tool.glyph.length > 1"
          [attr.aria-label]="tool.label"
          (click)="run(tool)"
        >
          <span class="tool__glyph">{{ tool.glyph }}</span>
          <span class="tool__tip">{{ tool.label }}</span>
        </button>
      }
    </div>
  }

  <!-- TipTap mounts its contenteditable surface here. Dropping or pasting an image
       onto it takes the same upload path as the toolbar button. -->
  <div
    class="editor__surface prose"
    #surface
    (drop)="onDrop($event)"
    (paste)="onPaste($event)"
  ></div>

  <input
    class="visually-hidden"
    #file
    type="file"
    accept="image/png,image/jpeg,image/webp,image/gif,image/avif"
    (change)="onFileChosen($event)"
  />

  <!-- Extensions as well as MIME types: an .m4a is announced differently by every
       operating system, and the picker would grey it out on the ones that disagree. -->
  <input
    class="visually-hidden"
    #audioFile
    type="file"
    accept="audio/*,.mp3,.wav,.m4a,.mp4a,.aac,.ogg,.oga,.opus,.flac"
    (change)="onAudioChosen($event)"
  />
</div>
